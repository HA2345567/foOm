name: Native Desktop / windows-native-check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-check:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/tauri-shell/src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: bun install

      - name: Setup FFmpeg (Windows)
        shell: pwsh
        run: |
          choco install ffmpeg -y
          echo "FFMPEG_DIR=C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg" >> $env:GITHUB_ENV

      - name: Prepare FFmpeg sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/desktop/tauri-shell/src-tauri/binaries" | Out-Null
          Copy-Item "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe" "apps/desktop/tauri-shell/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" -Force

      - name: Ensure WebView2 Runtime (Windows)
        shell: pwsh
        run: |
          $installed = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if ($null -eq $installed) {
            $installed = Get-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          }
          if ($null -eq $installed) {
            Write-Host "WebView2 Runtime not found. Downloading Microsoft Evergreen Bootstrapper..."
            $WebView2Installer = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $WebView2Installer
            Start-Process -FilePath $WebView2Installer -Args "/silent /install" -Wait
            Remove-Item $WebView2Installer
          } else {
            Write-Host "WebView2 Runtime is already installed."
          }

      - name: Build Desktop React UI (Vite)
        working-directory: apps/desktop/ui-react
        run: bun run build

      - name: Check Tauri app (Rust compile check)
        run: cargo check --manifest-path apps/desktop/tauri-shell/src-tauri/Cargo.toml
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1

      - name: Full Tauri build check
        run: cargo build --manifest-path apps/desktop/tauri-shell/src-tauri/Cargo.toml
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
