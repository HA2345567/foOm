name: Native Desktop

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows-native-check:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build desktop UI
        working-directory: apps/desktop/ui-react
        run: bun run build

      - name: Ensure ffmpeg sidecar exists for Tauri check
        run: |
          $ffmpegPath = "apps/desktop/tauri-shell/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $ffmpegPath)) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $ffmpegPath) -Force | Out-Null
            New-Item -ItemType File -Path $ffmpegPath -Force | Out-Null
          }

      - name: Check native workspace
        run: cargo check --workspace
