name: Native Desktop

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows-native-check:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build desktop UI
        working-directory: apps/desktop/ui-react
        run: bun run build

      - name: Check native workspace
        run: cargo check --workspace
