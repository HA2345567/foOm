name: Release Desktop Application / publish-windows-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable (Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/tauri-shell/src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Setup FFmpeg (Windows)
        shell: pwsh
        run: |
          choco install ffmpeg -y
          echo "FFMPEG_DIR=C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg" >> $env:GITHUB_ENV

      - name: Ensure WebView2 Runtime (Windows)
        shell: pwsh
        run: |
          $installed = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if ($null -eq $installed) {
            $installed = Get-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          }
          if ($null -eq $installed) {
            Write-Host "WebView2 Runtime not found. Downloading Microsoft Evergreen Bootstrapper..."
            $WebView2Installer = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $WebView2Installer
            Start-Process -FilePath $WebView2Installer -Args "/silent /install" -Wait
            Remove-Item $WebView2Installer
          } else {
            Write-Host "WebView2 Runtime is already installed."
          }

      - name: Build Desktop React UI
        working-directory: apps/desktop/ui-react
        run: bun run build

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'foOm ${{ github.ref_name }}'
          releaseBody: 'See release notes for foOm Screen Recorder.'
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop/tauri-shell
          configPath: apps/desktop/tauri-shell/src-tauri/tauri.conf.json
