        const { useState, useEffect, useRef, useMemo } = React;

        // --- Custom JS Video Crossfade ---
        const FadingVideo = ({ src, className, style }) => {
            const videoRef = useRef(null);
            const rafId = useRef(null);
            const fadingOutRef = useRef(false);
            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            const fadeTo = (target, duration) => {
                if (rafId.current) cancelAnimationFrame(rafId.current);
                const startOpacity = parseFloat(videoRef.current.style.opacity) || 0;
                const startTime = performance.now();

                const animate = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const current = startOpacity + (target - startOpacity) * progress;
                    videoRef.current.style.opacity = current;

                    if (progress < 1) {
                        rafId.current = requestAnimationFrame(animate);
                    }
                };
                rafId.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                const video = videoRef.current;
                
                const handleLoaded = () => {
                    video.style.opacity = 0;
                    video.play();
                    fadeTo(1, FADE_MS);
                };

                const handleTimeUpdate = () => {
                    if (!fadingOutRef.current && video.duration - video.currentTime <= FADE_OUT_LEAD && video.duration - video.currentTime > 0) {
                        fadingOutRef.current = true;
                        fadeTo(0, FADE_MS);
                    }
                };

                const handleEnded = () => {
                    video.style.opacity = 0;
                    setTimeout(() => {
                        video.currentTime = 0;
                        video.play();
                        fadingOutRef.current = false;
                        fadeTo(1, FADE_MS);
                    }, 100);
                };

                video.addEventListener('loadeddata', handleLoaded);
                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('ended', handleEnded);

                return () => {
                    if (rafId.current) cancelAnimationFrame(rafId.current);
                    video.removeEventListener('loadeddata', handleLoaded);
                    video.removeEventListener('timeupdate', handleTimeUpdate);
                    video.removeEventListener('ended', handleEnded);
                };
            }, []);

            return (
                <video 
                    ref={videoRef}
                    src={src}
                    muted 
                    playsInline 
                    preload="auto"
                    className={className}
                    style={{ ...style, opacity: 0 }}
                />
            );
        };

        // --- BlurText Component ---
        const BlurText = ({ text, className, delay = 0 }) => {
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) setIsVisible(true);
                }, { threshold: 0.1 });
                
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            const words = text.split(" ");

            return (
                <p ref={containerRef} className={`${className} flex flex-wrap justify-center row-gap-[0.1em]`}>
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={isVisible ? {
                                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                                opacity: [0, 0.5, 1],
                                y: [50, -5, 0]
                            } : {}}
                            transition={{
                                duration: 0.7,
                                times: [0, 0.5, 1],
                                ease: "easeOut",
                                delay: delay + (i * 100) / 1000
                            }}
                            style={{ display: 'inline-block', marginRight: '0.28em' }}
                        >
                            {word}
                        </motion.span>
                    ))}
                </p>
            );
        };
