<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foOom - Professional Auto-Zoom Video Recorder</title>
    <meta
      name="description"
      content="Professional auto-zoom video recorder with cinematic physics."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const isOverlay =
          window.location.pathname.includes("/overlay/") ||
          window.location.hash.includes("/overlay/") ||
          params.get("windowType") === "hud-overlay" ||
          params.get("windowType") === "source-selector";
        if (isOverlay) {
          document.documentElement.dataset.transparentWindow = "true";
          document.body.className = document.body.className.replace("bg-background", "");
          document.body.style.backgroundColor = "transparent";
          document.documentElement.style.backgroundColor = "transparent";
          document.body.style.margin = "0";
          document.getElementById("root")?.style.setProperty("background", "transparent", "important");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
