[package]
name = "foOm"
version = "0.2.0"
description = "Cross-platform cinematic screen recorder, Windows first"
authors = ["Harsh Bhardwaj"]
license = "MIT"
repository = "https://github.com/HA2345567/foOm"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["clock"] }
rfd = "0.15"
rust-core = { path = "../../rust-core" }
export-engine = { path = "../../../../renderer/export-engine" }
motion-engine = { path = "../../../../renderer/motion-engine" }
shared-core = { path = "../../shared-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
