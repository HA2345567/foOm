<!DOCTYPE html>
<html>
<head>
  <title>SVG to PNG Converter</title>
</head>
<body style="background: black; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <h2>Converting SVG to PNG...</h2>
  <canvas id="canvas" width="512" height="512" style="border: 1px solid #333; background: transparent;"></canvas>
  <script>
    const svgString = `<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M18 32L40 10H92V32H40V52H18V32Z" fill="#f5f5f7"/>
  <path d="M18 72L40 52H85L63 72H18Z" fill="#f5f5f7"/>
  <path d="M18 72H40V95H18V72Z" fill="#f5f5f7"/>
  <circle cx="53" cy="42" r="8.5" fill="#f5f5f7"/>
</svg>`;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const img = new Image();
    const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = function() {
      // Clear canvas to keep transparent background
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
      
      const pngUrl = canvas.toDataURL('image/png');
      
      // Output to console and update page for the subagent
      console.log("BASE64_RESULT:" + pngUrl);
      
      const pre = document.createElement('pre');
      pre.id = "base64-output";
      pre.style.wordBreak = "break-all";
      pre.style.maxWidth = "600px";
      pre.style.marginTop = "20px";
      pre.textContent = pngUrl;
      document.body.appendChild(pre);
      
      const h2 = document.querySelector('h2');
      if (h2) h2.textContent = "Conversion Complete!";
    };
    img.src = url;
  </script>
</body>
</html>
